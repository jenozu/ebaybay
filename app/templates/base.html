<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}eBayBay{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('listings.dashboard') if session.get('authenticated') else url_for('auth.login') }}">eBayBay</a>
    {% if session.get('authenticated') %}
    <nav class="topnav" aria-label="Primary navigation">
      <a href="{{ url_for('listings.dashboard') }}">Dashboard</a>
      <a href="{{ url_for('listings.new_listing') }}">New Listing</a>
      <a href="{{ url_for('oauth.settings') }}">Settings</a>
      <form method="post" action="{{ url_for('auth.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="topnav-signout" type="submit">Sign Out</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main class="shell">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
